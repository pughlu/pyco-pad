<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Code Editor</title>
  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Load Skulpt for Python Execution -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
</head>

<body>
  <!-- UI STRINGS CONFIGURATION -->
  <script>
    window.IDE_UI_STRINGS = {
      statusReadOnly: 'Read-Only',
      statusReady: 'Ready',
      statusSaved: 'Saved',
      statusFailed: 'Save Failed / Locked',
      statusSyncing: 'Syncing...',
      copied: 'Copied'
    };
  </script>

  <!-- Top Toolbar -->
  <div class="main-toolbar">
    <div class="toolbar-left">
      <div class="main-title pyco-logo">
        <span class="pyco-logo-py">python</span><span class="pyco-logo-pad">codepad</span>
      </div>
    </div>
    <div class="toolbar-actions">
      <span id="sync-status" style="display: none;">Connecting...</span>
      <button id="btn-config" class="btn-layout" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          style="vertical-align: middle;">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <button id="btn-layout" class="btn-layout" title="Change Layout">
        <span id="layout-icon">◫</span> Layout
      </button>
      <button id="btn-run" class="btn-run">► Run Code</button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container vertical-split" id="main-container">

    <!-- Editor Panel -->
    <div id="editor-wrapper">
      <div class="panel-header">
        <span>CODE</span>
        <button id="btn-show-output" class="btn-show-output">Show Output Panel</button>
      </div>
      <div id="custom-editor-container">
        <div id="line-numbers">1</div>
        <div id="code-overlay-wrapper">
          <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
          <textarea id="editing" spellcheck="false" placeholder="# write python code here"></textarea>
        </div>
      </div>
    </div>

    <!-- Resizer Handle -->
    <div class="resizer" id="resizer"></div>

    <!-- Output Panel -->
    <div id="output-wrapper">
      <div class="panel-header">
        <span>OUTPUT</span>
        <div class="panel-controls">
          <label class="safe-mode-label" id="safe-mode-container" style="display: none;">
            <input type="checkbox" id="chk-safe-mode" checked />
            <span>Safe Mode</span>
          </label>
          <button id="btn-clear" class="btn-sm btn-clear">Clear Output</button>
          <button id="btn-hide-output" class="btn-sm">Hide Output Panel</button>
        </div>
      </div>
      <div id="output"></div>
    </div>

  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="btn-close-settings" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>Theme:</label>
          <select id="theme-select">
            <option value="dark">Dark (Default)</option>
            <option value="light">Light</option>
            <option value="hc">High Contrast</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Font Size:</label>
          <div class="font-size-controls">
            <button id="btn-font-dec" class="btn-sm">-</button>
            <span id="font-size-display">14px</span>
            <button id="btn-font-inc" class="btn-sm">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
